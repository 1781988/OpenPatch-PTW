name: Apply OpenPatch source patch

on:
  push:
    branches: [main]
    paths:
      - tools/patch/**
      - .github/workflows/apply_patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and extract patch
        shell: bash
        run: |
          set -euo pipefail
          cat tools/patch/part* > /tmp/openpatch_patch.b64
          base64 -d /tmp/openpatch_patch.b64 > /tmp/openpatch_patch.tar.gz
          echo "9349527297f29d378aa9316b6a96d7d571f0201a30a958a540621edd7844699a  /tmp/openpatch_patch.tar.gz" | sha256sum -c -
          tar -xzf /tmp/openpatch_patch.tar.gz -C .

      - name: Validate Python syntax
        run: |
          python -m compileall -q \
            openpatch_ptw \
            train_openpatch.py eval_openpatch.py prepare_data.py \
            download_assets.py doctor.py run_all_experiments.py package_results.py \
            tests

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenPatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git reset HEAD -- .github/workflows tools/patch
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Harden reproducibility and result packaging"
          git push
