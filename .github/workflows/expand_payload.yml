name: Expand OpenPatch payload

on:
  push:
    branches: [main]
    paths:
      - tools/payload/**
      - .github/workflows/expand_payload.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and extract source payload
        shell: bash
        run: |
          set -euo pipefail
          cat tools/payload/part* > /tmp/openpatch_payload.b64
          base64 -d /tmp/openpatch_payload.b64 > /tmp/openpatch_payload.tar.gz
          echo "f3716519a9514c613e685c62eace165556b62ecaa711dcea3eaadfd09e3f8a2c  /tmp/openpatch_payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/openpatch_payload.tar.gz -C .
          chmod +x scripts/*.sh
          rm -rf tools/payload
          rm -f .github/workflows/expand_payload.yml

      - name: Validate Python syntax
        run: python -m compileall -q .

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenPatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Complete reproducible ICASSP experiment framework"
          git push
